name: Build PUBG Cheat DLL & BlindEye Driver

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build cheat.dll & BlindEye.sys
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install WDK via Chocolatey
      shell: pwsh
      run: |
        choco install windowsdriverkit10 -y --no-progress

    - name: Setup MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Setup CMake and Ninja
      uses: lukka/get-cmake@latest

    - name: Configure CMake
      shell: pwsh
      run: |
        cmake -B build -S . -G "Ninja" -DCMAKE_BUILD_TYPE=Release

    - name: Build All Targets
      shell: pwsh
      run: |
        cmake --build build --config Release --parallel

    - name: Collect artifacts
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path artifacts
        $dll = Get-ChildItem -Recurse -Filter "cheat.dll" build
        if ($dll) { Copy-Item $dll.FullName artifacts/ }
        $sys = Get-ChildItem -Recurse -Filter "*.sys" build
        if ($sys) { Copy-Item $sys.FullName artifacts/ }
        Get-ChildItem artifacts

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: PubgCheat-Release-Files
        path: artifacts/
        retention-days: 30
