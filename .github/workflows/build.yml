name: Build PUBG Cheat & BlindEye Driver

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-dll:
    name: Build cheat.dll
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Setup CMake and Ninja
      uses: lukka/get-cmake@latest

    - name: Configure CMake
      shell: pwsh
      run: |
        cmake -B build -S . -G "Ninja" -DCMAKE_BUILD_TYPE=Release

    - name: Build DLL
      shell: pwsh
      run: |
        cmake --build build --config Release --parallel

    - name: Collect DLL artifact
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path artifacts
        $dll = Get-ChildItem -Recurse -Filter "cheat.dll" build
        if ($dll) { Copy-Item $dll.FullName artifacts/ }
        Get-ChildItem artifacts

    - name: Upload cheat.dll artifact
      uses: actions/upload-artifact@v4
      with:
        name: cheat.dll
        path: artifacts/cheat.dll
        retention-days: 30

  build-driver:
    name: Build BlindEye.sys Driver
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install WDK (Windows Driver Kit) via Chocolatey
      shell: pwsh
      run: |
        choco install windowsdriverkit10 -y --no-progress

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build BlindEye Driver
      shell: pwsh
      run: |
        cd BlindEye
        msbuild BlindEye.vcxproj /p:Configuration=Release /p:Platform=x64 /p:TargetVersion=Windows10

    - name: Collect Driver artifact
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path driver_artifacts
        $sys = Get-ChildItem -Recurse -Filter "*.sys" BlindEye
        if ($sys) { Copy-Item $sys.FullName driver_artifacts/ }
        Get-ChildItem driver_artifacts

    - name: Upload BlindEye.sys artifact
      uses: actions/upload-artifact@v4
      with:
        name: BlindEye.sys
        path: driver_artifacts/
        retention-days: 30
