name: Build PUBG Cheat DLL, BlindEye Driver, KDMapper & ShieldMapper

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build All Release Binaries
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install WDK via Chocolatey
      shell: pwsh
      run: |
        choco install windowsdriverkit10 -y --no-progress

    - name: Setup MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Setup CMake and Ninja
      uses: lukka/get-cmake@latest

    - name: Configure CMake
      shell: pwsh
      run: |
        cmake -B build -S . -G "Ninja" -DCMAKE_BUILD_TYPE=Release

    - name: Build All Targets
      shell: pwsh
      run: |
        cmake --build build --config Release --parallel

    - name: Collect artifacts
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path artifacts
        $dll = Get-ChildItem -Recurse -Filter "cheat.dll" build
        if ($dll) { Copy-Item $dll.FullName artifacts/ }
        $sys = Get-ChildItem -Recurse -Filter "BlindEye.sys" build
        if ($sys) { Copy-Item $sys.FullName artifacts/ }
        $exe = Get-ChildItem -Recurse -Filter "kdmapper.exe" build
        if ($exe) { Copy-Item $exe.FullName artifacts/ }
        $sm = Get-ChildItem -Recurse -Filter "ShieldMapper.exe" build
        if ($sm) { Copy-Item $sm.FullName artifacts/ }
        Get-ChildItem artifacts

    - name: Upload Full Release Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: PubgCheat-Full-Release
        path: artifacts/
        retention-days: 30
