name: Build PUBG Cheat

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Setup CMake and Ninja
      uses: lukka/get-cmake@latest

    - name: Download ImGui
      shell: pwsh
      run: |
        $imguiVersion = "v1.91.1"
        Invoke-WebRequest -Uri "https://github.com/ocornut/imgui/archive/refs/tags/$imguiVersion.zip" -OutFile imgui.zip
        Expand-Archive -Path imgui.zip -DestinationPath .
        $imguiDir = Get-ChildItem -Directory -Filter "imgui-*" | Select-Object -First 1
        New-Item -ItemType Directory -Force -Path "Cheat/imgui"
        $files = @(
          "imgui.h", "imgui.cpp",
          "imgui_internal.h",
          "imgui_draw.cpp",
          "imgui_tables.cpp",
          "imgui_widgets.cpp",
          "backends/imgui_impl_win32.h",
          "backends/imgui_impl_win32.cpp",
          "backends/imgui_impl_dx11.h",
          "backends/imgui_impl_dx11.cpp"
        )
        foreach ($f in $files) {
          $src = Join-Path $imguiDir.FullName $f
          $dst = "Cheat/imgui/$(Split-Path $f -Leaf)"
          Copy-Item $src $dst
        }
        Write-Host "ImGui files copied:"
        Get-ChildItem "Cheat/imgui"

    - name: Configure CMake (Ninja)
      shell: pwsh
      run: |
        cmake -B build -S . -G "Ninja" -DCMAKE_BUILD_TYPE=Release

    - name: Build
      shell: pwsh
      run: |
        cmake --build build --config Release --parallel

    - name: Collect artifacts
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path artifacts
        $inj = Get-ChildItem -Recurse -Filter "Injector.exe" build
        if ($inj) { Copy-Item $inj.FullName artifacts/ }
        $dll = Get-ChildItem -Recurse -Filter "cheat.dll" build
        if ($dll) { Copy-Item $dll.FullName artifacts/ }
        Get-ChildItem artifacts

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: PubgCheat-Release-x64
        path: artifacts/
        retention-days: 30
